# docker compose up  → db(PostgreSQL 16) + app(Spring Boot, local 프로파일)
# 환경변수는 같은 폴더의 .env 에서 읽는다. 변수 이름은 README 참조, 값은 노션.
# 프로젝트 이름 고정 — 폴더 이름과 상관없이 네트워크가 dajaba_default (AI compose 가 external 로 붙는다), 볼륨은 dajaba_aml-db-data
name: dajaba

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-}@db:5432/langfuse
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_CONNECTION_STRING: redis://:${REDIS_PASSWORD:-}@redis:6379/1
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
  SALT: ${LANGFUSE_SALT:-}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
  TELEMETRY_ENABLED: "false"
  TZ: UTC

services:
  db:
    image: pgvector/pgvector:0.8.2-pg16-trixie   # PostgreSQL 16 + pgvector 0.8.2 (ai 스키마 RAG). 확장은 db/init/00_extensions.sql
                                                 # trixie 고정 — 기존 postgres:16(trixie, glibc 2.41) 볼륨과 collation 버전을 맞춤. bookworm 태그(pg16)는 2.36이라 경고
    container_name: aml-db
    environment:
      POSTGRES_DB: aml
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 아래 셋은 db/init/01_roles.sh 가 첫 기동 때 역할을 만들 때 쓴다
      APP_MIGRATE_PASSWORD: ${APP_MIGRATE_PASSWORD}
      APP_BACKEND_PASSWORD: ${APP_BACKEND_PASSWORD}
      APP_AI_PASSWORD: ${APP_AI_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - aml-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aml"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: aml-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local,json
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: aml
      APP_MIGRATE_PASSWORD: ${APP_MIGRATE_PASSWORD}
      APP_BACKEND_PASSWORD: ${APP_BACKEND_PASSWORD}
      APP_AI_PASSWORD: ${APP_AI_PASSWORD}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD}
      AI_BASE_URL: ${AI_BASE_URL:-http://ai:8000}
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY}
      AML_AI_MOCK: ${AML_AI_MOCK:-true} # local 목업(true)·진짜 AI(false). 진짜: AML_AI_MOCK=false docker compose up -d app (README)
      AML_AI_ASK_ENABLED: ${AML_AI_ASK_ENABLED:-false} # 케이스 질문 답변 켜기(true)·끄기(false, 기본) — SCRUM-291 (README)
      AML_DATASET_DIR: /data
      AML_CASE_POLICY_VERSION: ${AML_CASE_POLICY_VERSION:-}            # 비어 있으면 케이스 생성 배치가 POLICY_NOT_CONFIGURED
      AML_CASE_POLICY_LOW_TO_MEDIUM: ${AML_CASE_POLICY_LOW_TO_MEDIUM:-}
      AML_CASE_POLICY_MEDIUM_TO_HIGH: ${AML_CASE_POLICY_MEDIUM_TO_HIGH:-}
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0   # 관리 포트 8081 은 기본 127.0.0.1 — 컨테이너 안에선 Prometheus 가 app:8081 로 들어와야 해서. ports 에는 8081 안 넣음(호스트로 안 나감)
      # RabbitMQ (SCRUM-276). 기본 꺼짐 — 켜려면 .env 에 AML_RABBITMQ_ENABLED=true + ops 프로필. depends_on 에 넣지 않음(fail-open)
      AML_RABBITMQ_ENABLED: ${AML_RABBITMQ_ENABLED:-false}
      AML_BATCH_CHAIN_ENABLED: ${AML_BATCH_CHAIN_ENABLED:-false} # 배치 자동 연쇄(룰 스캔 → 점수 → 케이스 생성). 위 RabbitMQ 도 켜야 이어짐 — SCRUM-349
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      # 로그인 세션 Redis(db 0, SCRUM-273). 기본 꺼짐(메모리 세션) — 켜려면 .env 에 AML_SESSION_REDIS_ENABLED=true + ops 프로필.
      # depends_on 에 넣지 않음 — 켠 채 Redis 가 죽으면 앱은 떠 있고 세션이 필요한 요청만 503 SESSION_STORE_UNAVAILABLE
      AML_SESSION_REDIS_ENABLED: ${AML_SESSION_REDIS_ENABLED:-false}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data:ro

  ops-env-check:
    image: alpine:3.20
    profiles: [ops]
    mem_limit: 32m
    restart: "no"
    entrypoint: ["/bin/sh", "/ops/env-check.sh"]
    environment:
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBITMQ_USER: ${RABBITMQ_USER:-}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:-}
      LANGFUSE_NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      LANGFUSE_SALT: ${LANGFUSE_SALT:-}
      LANGFUSE_ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ./ops/env-check.sh:/ops/env-check.sh:ro

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [ops]
    mem_limit: 256m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:13.3.1
    profiles: [ops]
    mem_limit: 384m
    depends_on:
      ops-env-check:
        condition: service_completed_successfully
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  loki:
    image: grafana/loki:3.7.10
    profiles: [ops]
    mem_limit: 256m
    command: ["-config.file=/etc/loki/loki-config.yaml", "-target=all"]
    volumes:
      - ./ops/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    # distroless라 셸·wget이 없어 healthcheck을 생략한다.

  alloy:
    image: grafana/alloy:v1.22.0
    profiles: [ops]
    mem_limit: 256m
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    depends_on:
      loki:
        condition: service_started
    volumes:
      - ./ops/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # 컨테이너 목록·로그 수집에 필요해 읽기 전용으로 붙인다.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/12345"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.3-alpine
    profiles: [ops]
    mem_limit: 256m
    depends_on:
      ops-env-check:
        condition: service_completed_successfully
    # db 0 = 세션, db 1 = Langfuse.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    profiles: [ops]
    mem_limit: 384m
    depends_on:
      ops-env-check:
        condition: service_completed_successfully
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
      RABBITMQ_DEFAULT_VHOST: aml
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  minio:
    image: cgr.dev/chainguard/minio@sha256:59953701f8f8d0de81aab456f0b0b6c0a1804119415559bf7ede79d944108879 # 공식 Docker Hub 중단, 무료판은 latest뿐이라 digest 고정.
    profiles: [ops]
    mem_limit: 256m
    command: ["server", "/data", "--console-address", ":9001"]
    depends_on:
      ops-env-check:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MC_HOST_local: http://${MINIO_ROOT_USER:-}:${MINIO_ROOT_PASSWORD:-}@127.0.0.1:9000
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:5eee28fde834bf5da476a6e0cfaf98dfe9625761bab9cd297ebb7125a261ba35
    profiles: [ops]
    mem_limit: 64m
    restart: "no"
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-}:${MINIO_ROOT_PASSWORD:-}@minio:9000
    command: ["mb", "--ignore-existing", "local/str-reports", "local/langfuse"]
    depends_on:
      ops-env-check:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    profiles: [ops]
    mem_limit: 1g
    depends_on:
      ops-env-check:
        condition: service_completed_successfully
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsu \"elastic:$$ELASTIC_PASSWORD\" 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3
    profiles: [ops]
    mem_limit: 2g
    depends_on:
      ops-env-check:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      TZ: UTC
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./ops/clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  langfuse-db-init:
    image: pgvector/pgvector:0.8.2-pg16-trixie
    profiles: [ops]
    mem_limit: 64m
    restart: "no"
    entrypoint: ["/bin/sh", "/ops/langfuse-db-init.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:-}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - ./ops/postgres/langfuse-db-init.sh:/ops/langfuse-db-init.sh:ro
    depends_on:
      ops-env-check:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.82.0
    profiles: [ops]
    mem_limit: 768m
    environment:
      <<: *langfuse-env
      HOSTNAME: 0.0.0.0 # 모든 주소에서 받기 — 127.0.0.1 healthcheck용
      NODE_OPTIONS: --max-old-space-size=768 # Node 힙 = 컨테이너 상한(공식 권장)
    depends_on: &langfuse-depends-on
      ops-env-check:
        condition: service_completed_successfully
      langfuse-db-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3030/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.82.0
    profiles: [ops]
    mem_limit: 1g
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-env
      HOSTNAME: 0.0.0.0 # 모든 주소에서 받기 — 127.0.0.1 healthcheck용
      NODE_OPTIONS: --max-old-space-size=1024 # Node 힙 = 컨테이너 상한(공식 권장)
      LANGFUSE_INIT_ORG_ID: dajaba
      LANGFUSE_INIT_ORG_NAME: dajaba
      LANGFUSE_INIT_PROJECT_ID: dajaba-ai
      LANGFUSE_INIT_PROJECT_NAME: dajaba-ai
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
      LANGFUSE_INIT_USER_NAME: admin
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/public/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

volumes:
  aml-db-data:
  prometheus-data:
  grafana-data:
  loki-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  es-data:
  clickhouse-data:
