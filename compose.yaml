# docker compose up  → db(PostgreSQL 16) + app(Spring Boot, local 프로파일)
# 환경변수는 같은 폴더의 .env 에서 읽는다. 변수 이름은 README 참조, 값은 노션.
# 프로젝트 이름 고정 — 폴더 이름과 상관없이 네트워크가 dajaba_default (AI compose 가 external 로 붙는다), 볼륨은 dajaba_aml-db-data
name: dajaba

services:
  db:
    image: pgvector/pgvector:0.8.2-pg16-trixie   # PostgreSQL 16 + pgvector 0.8.2 (ai 스키마 RAG). 확장은 db/init/00_extensions.sql
                                                 # trixie 고정 — 기존 postgres:16(trixie, glibc 2.41) 볼륨과 collation 버전을 맞춤. bookworm 태그(pg16)는 2.36이라 경고
    container_name: aml-db
    environment:
      POSTGRES_DB: aml
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 아래 셋은 db/init/01_roles.sh 가 첫 기동 때 역할을 만들 때 쓴다
      APP_MIGRATE_PASSWORD: ${APP_MIGRATE_PASSWORD}
      APP_BACKEND_PASSWORD: ${APP_BACKEND_PASSWORD}
      APP_AI_PASSWORD: ${APP_AI_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - aml-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aml"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: aml-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: aml
      APP_MIGRATE_PASSWORD: ${APP_MIGRATE_PASSWORD}
      APP_BACKEND_PASSWORD: ${APP_BACKEND_PASSWORD}
      APP_AI_PASSWORD: ${APP_AI_PASSWORD}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD}
      AI_BASE_URL: ${AI_BASE_URL:-http://ai:8000}
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY}
      AML_DATASET_DIR: /data
      AML_CASE_POLICY_VERSION: ${AML_CASE_POLICY_VERSION:-}            # 비어 있으면 케이스 생성 배치가 POLICY_NOT_CONFIGURED
      AML_CASE_POLICY_LOW_TO_MEDIUM: ${AML_CASE_POLICY_LOW_TO_MEDIUM:-}
      AML_CASE_POLICY_MEDIUM_TO_HIGH: ${AML_CASE_POLICY_MEDIUM_TO_HIGH:-}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data:ro

volumes:
  aml-db-data:
