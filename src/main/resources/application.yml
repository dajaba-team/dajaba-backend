# 공통 설정. 프로파일별 차이는 아래 --- 블록. 비밀값은 전부 환경변수(.env, 값은 노션).
spring:
  application:
    name: aml
  config:
    import: optional:file:./.env[.properties]   # IDE 에서 바로 실행할 때 .env 를 읽는다 (compose 는 환경변수로 넘기므로 무관)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aml}
    username: app_backend
    password: ${APP_BACKEND_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    user: app_migrate                     # DDL 은 app_migrate 만 (레퍼런스 원칙 5)
    password: ${APP_MIGRATE_PASSWORD:}
    schemas: ops
    default-schema: ops
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate                  # 어떤 프로파일에서도 update/create 없음 (레퍼런스 7.1)
    open-in-view: false
    properties:
      hibernate:
        default_schema: ops
  jackson:
    property-naming-strategy: SNAKE_CASE  # 규약 0절. DTO 에 @JsonProperty 쓰지 않는다
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  # Redis 자동 설정은 의존성만으로 켜지지 않게 막는다. 세션을 Redis 로 켤 때(aml.session.redis.enabled=true)만
  # RedisSessionConfig 가 RedisAutoConfiguration 을 직접 가져온다 (SCRUM-273). 끄면 Redis 에 연결하지 않는다.
  # LettuceMetrics 는 켤 때도 뺀다 — 지표 태그에 Redis 주소(remote)가 붙는다.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.metrics.redis.LettuceMetricsAutoConfiguration
  # Redis = 로그인 세션만 (db 0, 03_shared §12). db 1 은 Langfuse
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      connect-timeout: 2s                 # Redis 가 죽었을 때 요청이 오래 매달리지 않게 → 503 SESSION_STORE_UNAVAILABLE
      timeout: 2s
  session:
    redis:
      repository-type: indexed            # 사용자별 색인(login_id) — maximumSessions(1)·관리자 세션 끊기가 찾는다
      namespace: aml:session
      configure-action: none              # 기동 때 CONFIG SET 안 함 — 키 공간 알림을 쓰지 않고, Redis 없이도 앱이 떠야 한다
      cleanup-cron: "-"                   # 만료 이벤트용 정리 작업 끔(이벤트를 안 씀). 만료 판단은 읽을 때, 키는 TTL 로 지워짐
    # 만료는 server.servlet.session.timeout(30m), 쿠키는 server.servlet.session.cookie 를 그대로 따른다
  # RabbitMQ (SCRUM-276, shared.messaging). aml.messaging.enabled=false(기본)면 연결하지 않는다.
  # 공통 ACK·재시도·DLQ 기본값 — 진희 공통 정책 확정 전 초안. 바꾸면 docs/03_shared.md §14 도 같이.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: aml
    connection-timeout: 3s                # 브로커가 죽었을 때 API 가 오래 매달리지 않게
    publisher-confirm-type: correlated    # JobPublisher 가 브로커 확인까지 기다린다
    publisher-returns: true
    template:
      mandatory: true                     # 큐가 없으면 반송 → JobPublisher false
    listener:
      simple:
        acknowledge-mode: auto            # 정상 반환 = ACK
        prefetch: 1                       # 배치 작업은 무거우니 하나씩
        concurrency: 1
        max-concurrency: 1
        default-requeue-rejected: false   # 재시도 다 쓰면 재큐 말고 DLQ
        missing-queues-fatal: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SESSION
        http-only: true
        same-site: lax

aml:
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    internal-key: ${AI_INTERNAL_KEY:}
    timeout-seconds: 90
    ask-timeout-seconds: 30                  # 질문 답변만 전체 30초(재시도 포함, 규약 6.2) — SCRUM-291
    ask-enabled: ${AML_AI_ASK_ENABLED:false} # 질문 답변 켜기(true)·끄기(false). 읽는 쪽은 cases — SCRUM-291
    ask-per-minute: 5                        # 질문하기 한 사람 최근 60초 한도, 넘으면 429 — SCRUM-302
    reference-search-timeout-seconds: 8      # 참고 사례 검색만 전체 8초(재시도 포함, 규약 6.2) — SCRUM-309
    reference-search-enabled: ${AML_AI_REFERENCE_SEARCH_ENABLED:false} # 참고 사례 검색 켜기. 읽는 쪽은 str — SCRUM-309
    max-batch: 500
  dataset-dir: ${AML_DATASET_DIR:./data}
  # 로그인 세션 저장소 — Redis(true)·서버 메모리(false, 기본). 끄면 지금처럼 재시작하면 모두 로그아웃 (SCRUM-273)
  session:
    redis:
      enabled: ${AML_SESSION_REDIS_ENABLED:false}
  # RabbitMQ 켜기(true)·끄기(false, 기본). 끄면 케이스 생성 등은 기존 동기(앱 안 실행기) 경로 (SCRUM-276)
  messaging:
    enabled: ${AML_RABBITMQ_ENABLED:false}
    confirm-timeout: 3s
  # 운영 등급 경계값 (CasePolicy, 미결 23). 평가 뒤 확정이라 기본값 없음 — 비어 있으면 케이스 생성 배치가 POLICY_NOT_CONFIGURED
  case-policy:
    version: ${AML_CASE_POLICY_VERSION:}
    low-to-medium: ${AML_CASE_POLICY_LOW_TO_MEDIUM:}
    medium-to-high: ${AML_CASE_POLICY_MEDIUM_TO_HIGH:}
  # STR 확정본 PDF (S8·P5). 보관 폴더는 data/ 아래라 커밋되지 않는다. 도커 app 은 컨테이너 안 폴더 — MinIO 는 ops 붙이기에서
  str:
    pdf:
      storage-dir: ${AML_STR_PDF_DIR:./data/str-reports}
      generate-after-report: true          # 모의 제출(P4)·다시 만들기(P5) 커밋 뒤 뒤에서 만들기. false 는 상태를 그대로 보는 테스트용
      stale-pending-after: 10m             # PENDING 이 이만큼 그대로면 만드는 도중 죽은 것으로 보고 P5 다시 만들기를 받는다(보통 1~2초)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

management:
  # actuator 는 관리 포트 8081 로만 (compose ports 에 안 넣음 → 호스트·nginx 밖으로 안 나감). Prometheus 는 app:8081 을 긁는다.
  # 8080 GET /actuator/health 는 프론트 연결 확인용 호환 컨트롤러(MainPortHealthController)가 상태만 돌려준다 (SCRUM-271, 03_shared §13)
  server:
    port: 8081
    # 듣는 주소 — bootRun·IDE 는 이 기계 안에서만. compose app 컨테이너만 0.0.0.0 을 넘긴다(Prometheus 가 app:8081 로 들어와야 함, SCRUM-271 후속)
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      # 응답 시간 버킷 고정 10개 — 기본 히스토그램(70여 개)은 Prometheus 256m 에 무거움. 90s 는 AI 호출 경로용
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s,10s,30s,90s
  health:
    rabbit:
      enabled: false                      # 도구가 죽어도 앱 health 는 UP (fail-open, SCRUM-263)
    redis:
      enabled: false                      # 세션 Redis 를 켜도 health 에 넣지 않음 — 넣을지는 08_decisions 후보 (SCRUM-273)

logging:
  level:
    com.team.aml: INFO
    # Spring 을 상속한 로그인 클래스는 로거 이름이 우리 패키지라 com.team.aml: DEBUG(local)를 따라간다.
    # 그러면 Spring 의 "사용자 못 찾음" 디버그에 입력한 login_id 원문이 찍힌다 → 모든 프로필에서 INFO 고정 (SCRUM-19)
    com.team.aml.shared.security.AppLoginProvider: INFO
    com.team.aml.shared.security.JsonLoginFilter: INFO
    # 보고서 PDF 라이브러리 — 기본이 INFO 라 PDF 마다 글꼴·CSS 안내가 여러 줄 찍힌다. 경고부터만
    com.openhtmltopdf: WARN
    # Redis 세션(SCRUM-273): 세션 끊기 중 세션을 못 찾으면 Spring 이 세션 ID 를 INFO 로 찍는다 → WARN 부터
    org.springframework.session.security.SpringSessionBackedSessionInformation: WARN
    # Lettuce 재연결 로그(INFO·WARN)는 Redis 주소를 찍는다. 장애는 SessionStoreFailureFilter 가 오류 클래스 이름만 남긴다
    io.lettuce.core: ERROR

---
# local — 개발. swagger, DevUserSeeder, CORS(5173), MockAiClient
spring:
  config:
    activate:
      on-profile: local
aml:
  ai:
    mock: ${AML_AI_MOCK:true}              # AI 목업(true)·진짜 AI 서버(false). compose·IDE(.env) 둘 다 AML_AI_MOCK 하나로 (SCRUM-262)
  dev-users:
    enabled: true
    password: ${DEV_USER_PASSWORD:}
  cors:
    allowed-origin: http://localhost:5173
logging:
  level:
    com.team.aml: DEBUG
    org.springframework.security: INFO

---
# test — Testcontainers 가 datasource 를 주입한다
spring:
  config:
    activate:
      on-profile: test
  flyway:
    locations: classpath:db/migration,classpath:db/test-migration   # 테스트 전용 테이블(V9000~)은 test 에서만 (SCRUM-68)
aml:
  ai:
    mock: true
  dev-users:
    enabled: false
  messaging:
    enabled: false                        # 테스트는 브로커 없이. 켜는 테스트는 직접 프로퍼티로
  str:
    pdf:
      storage-dir: build/str-reports-test # 테스트가 만든 확정본 PDF — gradle clean 으로 지워진다
  session:
    redis:
      enabled: false                      # 테스트는 메모리 세션. Redis 테스트는 직접 프로퍼티로 (SCRUM-273)

---
# prod — swagger 끔, 쿠키 Secure, CORS 없음, 목업 없음
spring:
  config:
    activate:
      on-profile: prod
server:
  servlet:
    session:
      cookie:
        secure: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
aml:
  ai:
    mock: false
  dev-users:
    enabled: false
