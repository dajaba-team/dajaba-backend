# PR이 올라오거나 develop/main에 머지될 때마다 깨끗한 리눅스에서 빌드·테스트를 돌린다.
# 맥·윈도우 누구 PC에서 만들었든 여기서 통과해야 머지 기준을 채운 것으로 본다.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# 같은 PR에 커밋을 연달아 올리면 이전 실행은 취소하고 마지막 것만 돌린다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle 의존성 캐시 + wrapper 검증
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # ArchitectureTest(DB 없이) + ApplicationContextTest(Testcontainers, 러너에 Docker 있음)
      - name: Test
        run: ./gradlew test --no-daemon

      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # 이미지가 빌드되는지만 확인한다 (배포 대상이 생기면 여기에 push 단계를 붙인다)
      - name: Build image
        run: docker build -t dajaba-backend:ci .
