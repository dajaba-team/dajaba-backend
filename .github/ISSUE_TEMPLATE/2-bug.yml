name: 🐛 버그 제보
description: 의도와 다르게 동작하거나 에러가 나는 경우
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        재현할 수 있게만 적어 주면 고치는 사람이 훨씬 빨라요. 브랜치는 `fix/{이슈번호}-{짧은설명}`.

  - type: dropdown
    id: area
    attributes:
      label: 발생 영역
      multiple: true
      options:
        - source (원천 데이터)
        - detection (탐지·룰)
        - cases (케이스·조사)
        - str (STR 초안·검증)
        - user (로그인·권한)
        - shared (공통 코드)
        - db (Flyway)
        - infra (Docker·CI·설정)
        - 잘 모르겠음
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 🐞 무슨 일이 있었나요?
      placeholder: inv01 로 POST /api/v1/auth/login 후 GET /api/v1/auth/me 를 부르면 401이 나옵니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔁 재현 방법
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 🙆 기대한 결과
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 📜 에러 로그 · 응답
      description: 스택트레이스나 에러 JSON(`request_id` 포함)을 붙여 주세요. 자동으로 코드 블록이 됩니다.
      render: shell

  - type: input
    id: env
    attributes:
      label: 💻 환경
      description: OS · 브랜치(또는 커밋) · 실행 방법
      placeholder: macOS · develop(a1b2c3d) · docker compose up
    validations:
      required: true

  - type: checkboxes
    id: check
    attributes:
      label: 확인
      options:
        - label: 최신 develop을 pull 받은 뒤에도 재현된다
          required: true
        - label: 로그에 비밀번호·키 같은 민감 정보가 없다
          required: true
